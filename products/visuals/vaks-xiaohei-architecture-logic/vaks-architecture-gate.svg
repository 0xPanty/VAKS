<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">VAKS review gate hand-drawn explainer</title>
  <desc id="desc">A white-background hand-drawn style illustration of VAKS: sources enter lightly, candidate understanding and a review gate filter them, reviewed knowledge supports an action package, and feedback returns without changing truth.</desc>
  <metadata>
    Inspired by Ian Xiaohei Illustrations by Ian, MIT License. This SVG is a VAKS local explanatory derivative and does not reuse example image compositions.
  </metadata>
  <defs>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Q4,6 1,1" fill="#f28a17"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Q4,6 1,1" fill="#2f80ed"/>
    </marker>
    <style>
      .ink { fill: none; stroke: #111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #111; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .orange { fill: none; stroke: #f28a17; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-orange); }
      .blue { fill: none; stroke: #2f80ed; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .red { fill: none; stroke: #e23b30; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 34px; fill: #111; font-weight: 500; }
      .small { font-size: 27px; }
      .note-red { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 32px; fill: #e23b30; font-weight: 600; }
      .note-blue { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 30px; fill: #2f80ed; font-weight: 600; }
      .note-orange { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 30px; fill: #f28a17; font-weight: 600; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>

  <!-- left source tray -->
  <path class="ink" d="M110 473 C150 465,214 466,260 476 C274 512,271 567,253 603 C205 613,154 609,113 597 C98 552,97 511,110 473 Z"/>
  <path class="thin" d="M128 494 C169 487,215 491,247 498"/>
  <path class="thin" d="M127 570 C171 581,210 580,246 572"/>
  <text class="label" x="139" y="445">来源</text>

  <!-- messy source slips -->
  <g transform="rotate(-7 190 315)">
    <path class="thin" d="M132 276 L264 266 L272 333 L143 345 Z"/>
    <path class="thin" d="M154 296 L241 290"/>
    <path class="thin" d="M156 317 L222 313"/>
  </g>
  <g transform="rotate(8 225 374)">
    <path class="thin" d="M157 351 L286 345 L296 414 L168 425 Z"/>
    <path class="thin" d="M180 373 L257 369"/>
    <path class="thin" d="M181 394 L247 392"/>
  </g>
  <g transform="rotate(-2 174 400)">
    <path class="thin" d="M91 381 L226 377 L228 445 L96 448 Z"/>
    <path class="thin" d="M116 403 L196 402"/>
    <path class="thin" d="M117 424 L185 424"/>
  </g>

  <!-- main flow to gate -->
  <path class="orange" d="M305 515 C409 494,475 492,554 508"/>

  <!-- central review gate machine -->
  <path class="ink" d="M582 316 C635 298,782 297,841 316 C864 385,866 583,842 651 C763 673,639 671,581 649 C552 574,553 389,582 316 Z"/>
  <path class="ink" d="M612 352 C664 338,771 339,813 353"/>
  <path class="ink" d="M614 620 C691 637,759 636,811 621"/>
  <path class="thin" d="M629 376 L628 606"/>
  <path class="thin" d="M807 376 L807 604"/>

  <!-- candidate lever and review lever -->
  <path class="thin" d="M664 467 C702 441,737 432,781 423"/>
  <circle cx="788" cy="421" r="12" fill="#2f80ed"/>
  <path class="red" d="M665 530 C714 560,763 566,823 551"/>
  <circle cx="831" cy="548" r="13" fill="#e23b30"/>

  <text class="note-blue" x="604" y="285">候选理解</text>
  <text class="note-red" x="740" y="704">复核闸门</text>

  <!-- Xiaohei operating gate -->
  <path d="M690 502 C691 454,712 421,754 421 C803 421,825 456,824 520 C823 587,791 612,746 608 C706 604,688 570,690 502 Z" fill="#111"/>
  <circle cx="735" cy="481" r="10" fill="#fff"/>
  <circle cx="780" cy="481" r="10" fill="#fff"/>
  <path class="thin" d="M735 628 C733 660,727 678,721 697"/>
  <path class="thin" d="M785 627 C787 656,794 676,803 696"/>
  <path class="thin" d="M695 530 C668 523,647 512,630 497"/>
  <path class="thin" d="M820 534 C852 524,866 506,876 486"/>
  <path class="thin" d="M749 527 C759 521,770 522,779 528"/>

  <!-- waiting basket -->
  <path class="ink" d="M596 692 C638 681,701 683,740 694 L723 760 C675 769,625 765,593 751 Z"/>
  <text class="label small" x="617" y="792">待复查</text>
  <path class="thin" d="M616 717 C647 710,690 711,721 719"/>
  <path class="thin" d="M622 743 C655 751,687 751,713 743"/>

  <!-- blocked slips -->
  <path class="thin" d="M520 346 C548 339,566 340,587 350"/>
  <path class="thin" d="M521 379 C549 371,567 373,586 383"/>
  <path class="red" d="M560 325 L582 354 M586 324 L558 356"/>

  <!-- warning note -->
  <path class="red" d="M869 358 C928 338,970 336,1030 349"/>
  <text class="note-red" x="884" y="328">相似≠支持</text>
  <path class="red" d="M1021 350 C1012 362,1006 374,998 390"/>

  <!-- flow out of gate -->
  <path class="orange" d="M867 516 C958 508,1012 507,1089 518"/>

  <!-- reviewed knowledge box and bridge -->
  <path class="ink" d="M1114 429 C1177 411,1273 413,1324 430 C1332 478,1332 557,1321 601 C1261 616,1160 616,1112 599 C1100 543,1101 480,1114 429 Z"/>
  <text class="label" x="1157" y="402">已审知识</text>
  <path class="thin" d="M1143 465 L1288 457 L1292 504 L1140 512 Z"/>
  <path class="thin" d="M1147 533 L1290 529 L1292 571 L1146 578 Z"/>
  <path class="thin" d="M1170 480 L1244 475"/>
  <path class="thin" d="M1171 550 L1255 547"/>

  <!-- tiny bridge from reviewed knowledge to action package -->
  <path class="ink" d="M1088 649 C1152 628,1261 628,1329 650"/>
  <path class="thin" d="M1116 641 L1110 680"/>
  <path class="thin" d="M1168 633 L1164 681"/>
  <path class="thin" d="M1225 632 L1222 680"/>
  <path class="thin" d="M1284 639 L1282 680"/>

  <path class="orange" d="M1323 514 C1370 515,1402 529,1430 559"/>

  <!-- action package -->
  <path class="ink" d="M1418 584 C1457 571,1512 576,1538 594 C1544 639,1536 691,1518 720 C1468 732,1417 724,1392 701 C1389 655,1394 612,1418 584 Z"/>
  <path class="thin" d="M1409 622 C1449 632,1503 631,1533 617"/>
  <path class="thin" d="M1442 584 C1459 610,1469 635,1476 720"/>
  <text class="label small" x="1403" y="770">行动包</text>

  <!-- blue feedback loop -->
  <path class="blue" d="M1465 745 C1252 838,765 849,344 719 C240 687,182 650,148 615"/>
  <text class="note-blue" x="662" y="845">反馈只回流</text>

  <!-- small no-truth mark -->
  <path class="thin" d="M336 705 C355 700,381 701,398 710 C403 730,400 752,389 765 C362 771,338 766,327 753 C322 733,324 716,336 705 Z"/>
  <text class="note-blue" x="418" y="724">不改 truth</text>

  <!-- simple stamped card passing through -->
  <g transform="rotate(5 945 470)">
    <path class="thin" d="M918 438 L996 439 L998 492 L918 493 Z"/>
    <path class="thin" d="M933 457 L981 457"/>
    <circle cx="964" cy="477" r="13" class="red"/>
  </g>
</svg>
